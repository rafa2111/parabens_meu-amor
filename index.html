<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley - Giorgio & Rafaella</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --stardew-wood: #8b4513;
            --stardew-dark-wood: #5c2e0b;
            --stardew-border: #e6c280;
            --stardew-bg: #f4e4bc;
            --pink-accent: #ffb7c5;
            --dark-pink: #d87093;
            --text-color: #4a2e1b;
        }

        body {
            background-color: #2b1d14;
            background-image: radial-gradient(circle, #422a1d 10%, #2b1d14 90%);
            color: var(--text-color);
            font-family: 'VT323', monospace;
            font-size: 24px;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Container Principal com Moldura de Madeira Stardew */
        .stardew-box {
            background-color: var(--stardew-bg);
            border: 6px solid var(--stardew-wood);
            outline: 3px solid var(--stardew-border);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2), 0 8px 16px rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 25px;
            width: 100%;
            max-width: 750px;
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .pixel-btn {
            background: linear-gradient(180deg, #ff91a4 0%, var(--dark-pink) 100%);
            color: #ffffff;
            border: 4px solid var(--stardew-wood);
            outline: 2px solid var(--stardew-border);
            padding: 10px 24px;
            font-family: 'VT323', monospace;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--stardew-dark-wood);
            margin: 8px;
            text-shadow: 2px 2px #000;
            transition: transform 0.1s, filter 0.1s;
        }
