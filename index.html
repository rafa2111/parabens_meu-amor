      --valentines: #eb3f84;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;

    html {
      animation: html-bg 5s ease infinite;
    }

    .heart-bg-wrapper {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
      opacity: 0.95; /* Alta visibilidade do coração */
    }

    /* Coração de Fundo */
    .heart {
      position: relative;
      width: 280px;
      height: 280px;
      background: var(--valentines);
      transform: rotate(45deg);
      animation: heart 5s ease infinite;
    }

    .heart:before,
    .heart:after {
      content: "";
      width: 280px;
      height: 280px;
      position: absolute;
      background: var(--valentines);
      border-radius: 280px;
      transition: 1s ease all;
    }

      top: -140px;
      left: 0;
      animation: left 5s ease infinite;
